<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projektplan Editor</title>
<style>
:root{
  --surface:#ffffff; --surface-2:#f4f5f6; --line:#e6e8ea; --line-strong:#c9cdd1;
  --text:#1d2225; --text-2:#555d63; --text-3:#8b9399;
  --mint:#00B1AD; --mint-d:#006663; --red:#D93B3B; --heute:#D93B3B; --dp:60%; --dc:#000; --ms-bg:#ffffff; --ms-bd:#7d868d; --stat-prog:#4f5964;
  --head-bg:#eef0f2; --head-text:#1d2225; --head-sub:#68727a; --head-line:rgba(0,0,0,.16); --head-line2:rgba(0,0,0,.09); --btn-pri:#2f3539;
  --lw:380px; --row:38px; --hh:54px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#16191b; --surface-2:#1e2225; --line:#2a2f33; --line-strong:#3d4348;
    --text:#e8eaec; --text-2:#b3babf; --text-3:#80888e;
    --head-bg:#2a3034; --head-text:#ffffff; --head-sub:#b9c0c5; --head-line:rgba(255,255,255,.3); --head-line2:rgba(255,255,255,.16); --btn-pri:#e8eaec; --red:#E5534B; --heute:#F0605A; --dp:80%; --dc:#fff; --ms-bg:#e8eaec; --ms-bd:#9aa2a8; --stat-prog:#aab4bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --surface:#16191b; --surface-2:#1e2225; --line:#2a2f33; --line-strong:#3d4348;
    --text:#e8eaec; --text-2:#b3babf; --text-3:#80888e;
    --head-bg:#2a3034; --head-text:#ffffff; --head-sub:#b9c0c5; --head-line:rgba(255,255,255,.3); --head-line2:rgba(255,255,255,.16); --btn-pri:#e8eaec; --red:#E5534B; --heute:#F0605A; --dp:80%; --dc:#fff; --ms-bg:#e8eaec; --ms-bd:#9aa2a8; --stat-prog:#aab4bd;
    color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--text);font:13px/1.4 Verdana,Geneva,"DejaVu Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;padding:14px 24px 12px}
header.top{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
h1{font-size:18px;line-height:1.3;font-weight:700;margin:0 0 3px;max-width:900px;cursor:pointer}
h1:hover{text-decoration:underline;text-decoration-color:var(--mint);text-underline-offset:4px}
.meta{color:var(--text-2);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px;color:var(--text-2);margin:0 0 5px 2px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:22px;height:10px;border-radius:3px;display:inline-block;position:relative;overflow:hidden;background:color-mix(in oklab,#8A94A0 85%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,#8A94A0 60%,#000)}
.sw.doku{background:repeating-linear-gradient(135deg,color-mix(in oklab,#8A94A0 85%,var(--surface)) 0 3px,color-mix(in oklab,#8A94A0 40%,var(--surface)) 3px 6px)}
.sw.done{background:linear-gradient(90deg,color-mix(in oklab,#8A94A0 var(--dp),var(--dc)) 50%,color-mix(in oklab,#8A94A0 85%,var(--surface)) 50%)}
.sw.sw-ms,.sw.sw-ms{width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--ms-bg);border:2px solid var(--ms-bd)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--text-3);background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--btn-pri);border-color:var(--btn-pri);color:var(--surface)}
.btn.pri:hover:not(:disabled){opacity:.88;background:var(--btn-pri)}
.btn.danger:hover:not(:disabled){border-color:var(--red);color:var(--red);background:var(--surface)}
.grow{flex:1}
.tgl{position:relative}
.tgl .ind{display:none;width:8px;height:8px;border-radius:50%;background:var(--red);position:absolute;top:-3px;right:-3px;box-shadow:0 0 0 2px var(--surface)}
.tgl.warn .ind{display:block}
.kpirow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.kpirow .kpis{margin-bottom:0}
.toolbar{display:grid;grid-template-rows:0fr;margin-bottom:0;opacity:0;visibility:hidden;transition:grid-template-rows .1s ease-out,opacity .1s ease-out,margin .1s ease-out,visibility 0s .1s}
.toolbar.open{grid-template-rows:1fr;margin-bottom:6px;opacity:1;visibility:visible;transition:grid-template-rows .1s ease-out,opacity .1s ease-out,margin .1s ease-out}
.toolwrap{min-height:0;overflow:hidden}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;transform:translateX(-16px);transition:transform .1s ease-out}
.toolbar.open .tools{transform:none}
.btn.tgl{padding:6px 9px;font-size:16px;line-height:1}
.tgl .ico{display:inline-block;transition:transform .1s ease-out}
.tgl.open .ico{transform:rotate(60deg)}
.tgl.open{background:var(--surface-2);border-color:var(--text-3)}
.toolbar.open .tgl{background:var(--surface-2);border-color:var(--text-3)}
.auto{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:12px}
.auto input{accent-color:var(--text-2)}
.status{font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dirty .dot{background:var(--red)}
.saved .dot{background:var(--mint)}
#banner{display:none;margin-bottom:8px;padding:9px 12px;border-radius:6px;font-size:12px;border:1px solid var(--red);background:color-mix(in oklab,var(--red) 8%,var(--surface))}
#banner.info{border-color:var(--mint);background:color-mix(in oklab,var(--mint) 9%,var(--surface))}
#banner button{margin-left:10px}
.scroll{border:1px solid var(--line-strong);border-radius:2px;background:var(--surface)}
.chart{position:relative;min-width:calc(var(--lw) + 360px);padding-bottom:4px}
.row{display:grid;grid-template-columns:var(--lw) 1fr;min-height:var(--row)}
.row > .label{padding:4px 16px 4px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.row > .lane{position:relative}
.row[data-id],.row[data-phase]{cursor:pointer}
.row,.row>*{position:relative;z-index:1}
.name{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.head{min-height:0;border-bottom:1px solid var(--line-strong);position:sticky;top:0;border-radius:1px 1px 0 0;background:var(--head-bg);color:var(--head-text);z-index:5}
.row.head .lane{height:var(--hh)}
.row.head .label{justify-content:center;font-size:11px;font-weight:700;color:var(--head-sub);padding-left:16px}
.mon,.kw{position:absolute;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mon{top:0;height:100%;box-sizing:border-box;font-weight:700;padding:6px 0 0 6px;border-left:1px solid var(--head-line)}
.kw{top:24px;color:var(--head-sub);padding-left:6px}
.dd{position:absolute;top:44px;text-align:center;font:6.5px/1 Arial,Helvetica,sans-serif;color:var(--head-sub);opacity:.75;font-variant-numeric:tabular-nums;letter-spacing:-.05em;white-space:nowrap}
.dd.we{opacity:.35}
.mo2,.yr{display:none;position:absolute;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.yr{top:0;height:100%;font-weight:700;padding:6px 0 0 6px;border-left:1px solid var(--head-line)}
.mo2{top:26px;height:28px;font-size:11px;color:var(--head-sub);padding:2px 0 0 4px;border-left:1px solid var(--head-line2)}
/* lv0: Tage + KW + Monate | lv1: Wochen | lv2: Monate | lv3: Jahre */
.lv1 .dd:not(.mo){visibility:hidden}
.lv1 .kw .k{display:none}
.lv2 .dd,.lv2 .kw,.lv2 .mon,.lv3 .dd,.lv3 .kw,.lv3 .mon{display:none}
.lv2 .mo2,.lv2 .yr,.lv3 .yr{display:block}
.lv3 .yr{font-size:11px;padding:19px 0 0 4px}
.lv2 .overlay,.lv3 .overlay{background-image:none}
.lv3 .frei-label{display:none}
.chart::after{content:"";position:absolute;left:calc(var(--lw) - 1px);top:0;bottom:0;width:1px;background:var(--line-strong);z-index:6;pointer-events:none}
.overlay{position:absolute;top:var(--hh);bottom:0;left:var(--lw);right:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(to right,transparent calc(500%/7),var(--surface-2) calc(500%/7)),
                   linear-gradient(to right,var(--line) 1px,transparent 1px);
  background-size:calc(100% * 7 / var(--days)) 100%}
/* Monatsgrenze, eine Spur kräftiger als die Wochenlinien */
.mline{position:absolute;top:0;bottom:0;width:1px;background:var(--line-strong)}
.frei{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 4px,var(--line-strong) 4px,var(--line-strong) 5px);opacity:.7}
.frei-label{position:absolute;top:4px;font-size:10.5px;color:var(--text-3);writing-mode:vertical-rl;padding-top:6px}
.heute{position:absolute;top:var(--hh);bottom:0;width:2px;margin-left:-1px;background:var(--heute);display:none;z-index:4;pointer-events:none}
.heute b{position:absolute;top:2px;left:5px;font-size:10px;font-weight:700;color:var(--heute);white-space:nowrap}
/* Haupt-AP: Gruppe mit Kasten */
.grp{position:relative;margin:4px 0 0}
.grp::before{content:"";position:absolute;inset:0;border-radius:2px;background:color-mix(in oklab,var(--h) 6%,transparent);pointer-events:none;z-index:0}
.grp .boxlayer{position:absolute;top:0;bottom:0;left:var(--lw);right:0;z-index:0;pointer-events:none}
.grp .box{position:absolute;top:1px;bottom:1px;border-radius:9px;
  background:color-mix(in oklab,var(--h) 17%,transparent);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--h) 55%,transparent);overflow:hidden}
.grp.zu .box{top:50%;bottom:auto;height:30px;margin-top:-15px;border-radius:7px;background:color-mix(in oklab,var(--h) 55%,var(--surface));box-shadow:none}
.box .pg{position:absolute;left:0;top:0;bottom:0;background:color-mix(in oklab,var(--h) var(--dp),var(--dc))}
.grp > .row > .label{background:color-mix(in oklab,var(--h) 19%,var(--surface))}
.grp > .row.phase > .label{background:color-mix(in oklab,var(--h) 34%,var(--surface))}
.grp.zu > .row.phase > .label{background:color-mix(in oklab,var(--h) 26%,var(--surface))}
.grp > .row + .row{border-top:1px solid var(--line)}
.row.phase{min-height:38px}
.row.phase > .label{flex-direction:row;align-items:center;gap:8px}
.row.phase .tx{min-width:0;flex:1}
.row.phase .name{font-weight:400;font-size:13px;white-space:normal}
.chev{border:0;background:transparent;cursor:pointer;width:22px;height:22px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--text-2);padding:0}
.chev:hover{background:color-mix(in oklab,var(--h) 30%,transparent)}
.chev::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-1px,-1px);transition:transform .12s}
.grp.zu .chev::before{transform:rotate(-45deg)}
.nr{color:var(--text-3);font-variant-numeric:tabular-nums;margin-right:6px;font-weight:400}
/* Aufgabe: Nummer links, Name und Datum bündig daneben */
.row[data-id] > .label{display:grid;grid-template-columns:auto minmax(0,1fr);align-content:center;align-items:baseline}
.row[data-id] .nr{font-size:11.5px;min-width:var(--nrw)}
.row[data-id] .sub{grid-column:2}
.row[data-id]:hover > .label,.row[data-phase]:hover > .label{background:color-mix(in oklab,var(--h) 42%,var(--surface))}
.row.sel > .label{background:color-mix(in oklab,var(--mint) 14%,var(--surface))!important;box-shadow:inset 0 0 0 2px var(--mint)}
.bar{position:absolute;top:50%;height:16px;margin-top:-8px;border-radius:4px;overflow:hidden;min-width:3px;
  background:color-mix(in oklab,var(--bh,var(--h)) 85%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--bh,var(--h)) 60%,#000)}
.bar.doku{background:repeating-linear-gradient(135deg,color-mix(in oklab,var(--bh,var(--h)) 85%,var(--surface)) 0 5px,color-mix(in oklab,var(--bh,var(--h)) 40%,var(--surface)) 5px 10px)}
.bar .done{position:absolute;inset:0 auto 0 0;background:color-mix(in oklab,var(--bh,var(--h)) var(--dp),var(--dc))}
.row[data-id]:hover .bar,.row.sel .bar,.row.drag .bar{outline:2px solid var(--mint);outline-offset:1px}
/* Griffe an den Balkenenden: links Start, rechts Dauer. Liegen fast ganz außerhalb, damit die Balkenmitte zum Verschieben frei bleibt */
.hd{position:absolute;top:50%;width:9px;height:22px;margin-top:-11px;cursor:ew-resize;touch-action:none;z-index:2}
.hd.l{margin-left:-8px}
.hd.r{margin-left:-1px}
.hd::after{content:"";position:absolute;top:5px;bottom:5px;width:5px;border-radius:3px;background:#fff;box-shadow:0 0 0 1.5px var(--mint);opacity:0;transition:opacity .1s;pointer-events:none}
.hd.l::after{left:5.5px}
.hd.r::after{left:-1.5px}
.row[data-id]:hover .hd::after{opacity:.6}
.hd:hover::after,.row.drag .hd::after{opacity:1}
.bar,.ms{cursor:grab;touch-action:none}
/* Kopfzeile der Haupt-AP: Fläche über dem Kasten verschiebt die ganze Phase */
.pgrip{position:absolute;top:0;bottom:0;cursor:grab;touch-action:none}
.grp:has(.pgrip:hover) .box,.grp.drag .box{box-shadow:inset 0 0 0 2px var(--mint)}
html.dragging,html.dragging *{cursor:ew-resize!important;user-select:none}
html.dragging.mv,html.dragging.mv *{cursor:grabbing!important}
.ms{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:var(--ms-bg);border:2px solid var(--ms-bd);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.pct{position:absolute;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--text-2);padding-left:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#tip{position:fixed;z-index:30;pointer-events:none;background:#2b3135;color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;max-width:320px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#tip b{font-weight:700}
.ck{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.okb{display:inline-block;width:16px;height:16px;border-radius:50%;background:color-mix(in oklab,var(--h) 60%,#000);position:relative;vertical-align:-3px;margin-left:8px}
.okb .ck{width:10px;height:10px;margin:-5px 0 0 -5px}
.box .ck{width:14px;height:14px;margin:-7px 0 0 -7px}
.kpis{display:flex;flex-wrap:nowrap;align-items:stretch;margin-bottom:8px;width:fit-content;max-width:100%;border:1px solid var(--line-strong);border-radius:2px;background:var(--surface-2)}
.times{display:flex;flex-wrap:nowrap;gap:10px 32px;align-items:center;padding:9px 22px 9px 26px;position:relative}
.times::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:1px;background:var(--line-strong)}
.times .t{display:flex;flex-direction:column;gap:3px}
.times .tl{font-size:12px;color:var(--text-2);font-weight:700}
.times .tv{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column;gap:6px;width:430px;flex:none;padding:9px 22px 9px 14px}
.stat{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:12px}
.stat .sl{font-size:12px;color:var(--text-2);font-weight:700}
.stat .sbar{height:8px;border-radius:4px;background:var(--line-strong);overflow:hidden}
.stat .sbar i{display:block;height:100%;border-radius:4px}
.stat .sv{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
/* Drawer */
/* clip statt hidden: hidden macht #drawer zum Scroll-Container, dann bleibt .in nicht sticky stehen */
#drawer{width:0;overflow:hidden;overflow:clip;border-left:0;background:var(--surface);flex:none;transition:width .15s}
#drawer.open{width:380px;border-left:1px solid var(--line-strong)}
#drawer .in{width:380px;padding:20px 20px 32px;position:sticky;top:0;max-height:100vh;overflow:auto}
#drawer h2{font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
#drawer h2 .x{margin-left:auto}
.fld{margin-bottom:12px}
.fld > label,.fld > .lb{display:block;font-size:11px;color:var(--text-2);margin-bottom:4px;font-weight:700;letter-spacing:.02em}
.fld .hint{font-weight:400;color:var(--text-3)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--mint);box-shadow:0 0 0 2px color-mix(in oklab,var(--mint) 25%,transparent)}
.fld textarea{min-height:64px;resize:vertical}
.fld.aus{opacity:.45}
.fld.aus input{cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range{display:flex;gap:10px;align-items:center}
.range input[type=range]{flex:1;accent-color:var(--text-2)}
.range output{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.checks{max-height:200px;overflow:auto;border:1px solid var(--line-strong);border-radius:6px;padding:4px 0}
.checks .g{font-size:10.5px;color:var(--text-3);padding:6px 10px 2px;font-weight:700}
.checks label{display:flex;gap:8px;padding:3px 10px;font-size:12px;cursor:pointer;align-items:flex-start}
.checks label:hover{background:var(--surface-2)}
.checks input{margin-top:3px;accent-color:var(--text-2)}
.info{background:var(--surface-2);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.swrow{display:flex;gap:6px;flex-wrap:wrap}
.swb{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0;font-size:10px;color:var(--text-2);background:var(--surface-2)}
.swb.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}
.swb:hover{transform:scale(1.08)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:900px){#drawer.open{position:fixed;right:0;top:0;bottom:0;z-index:20;width:min(380px,100vw);box-shadow:-8px 0 24px rgba(0,0,0,.2)}:root{--lw:210px}.main{padding:16px}}
@media (max-width:900px){.kpis{flex-wrap:wrap}.stats{width:100%}.times{border-top:1px solid var(--line);width:100%;padding-left:22px}.times::before{display:none}}
@page{size:A4 landscape;margin:8mm}
html.printing{--lw:380px}
.printing .main{width:1480px;max-width:1480px;flex:none;padding:20px}
@media print{
  html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:var(--surface)}
  .toolbar,#drawer,#banner,#tip,.chev,.hd,.pgrip{display:none!important}
  .app{display:block;min-height:0}
  .scroll{overflow:visible;max-height:none}
  .chart{min-width:0}
  .main{padding:20px}
  .row.head{position:static}
}
</style></head>
<body>
<div class="app">
  <div class="main">
    <header class="top">
      <div><h1 id="h1" title="Projekteinstellungen"></h1><div class="meta" id="meta"></div></div>
    </header>
    <div class="kpirow"><div class="kpis"><div class="stats" id="stats"></div><div class="times" id="times"></div></div>
      <button class="btn tgl" id="bTools" aria-expanded="false" aria-controls="tools" title="Werkzeuge ein-/ausklappen" aria-label="Werkzeuge"><span class="ico">⚙</span><i class="ind"></i></button></div>
    <div class="toolbar">
      <div class="toolwrap"><span class="tools" id="tools">
      <button class="btn" id="bOpen" title="YAML-Datei öffnen">Öffnen</button>
      <button class="btn pri" id="bSave" title="Strg+S">Speichern</button>
      <button class="btn" id="bPdf" title="Plan als PDF speichern (im Druckdialog „Als PDF speichern" wählen)">Exportieren (PDF)</button>
      <button class="btn" id="bUndo" title="Strg+Z">↶ Rückgängig</button>
      <button class="btn" id="bRedo" title="Strg+Y">↷ Wiederholen</button>
      <button class="btn" id="bPhase">+ Phase</button>
      <button class="btn" id="bProj">Projekt</button>

<script type="text/plain" id="default-yaml"># Projektplan, Quelle für den Editor (gantt.html)
#
# Regeln:
#   dauer        Arbeitstage (Wochenenden und "frei" zählen nicht), 0 erlaubt; entfällt bei Meilensteinen
#   nach         ID oder Liste von IDs; Start am nächsten Arbeitstag nach dem spätesten Ende

titel: Kamerabasierte Prozessüberwachung im FDM-Druck zur automatischen Erkennung von Druckfehlern
autor: Max Mustermann
start: 2026-10-05
frei:
  - 2026-11-20                  # einzelner Tag (Exkursion)
  - 2026-12-24..2027-01-01      # Zeitraum (Weihnachtsschließung)

phasen:
  - name: Einarbeitung und Stand der Technik
    aufgaben:

</script>
<script>
//#core-begin
const WT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const MONATE=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const DAY=864e5;
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());if(!m)throw new Error("Ungültiges Datum: "+s);const t=Date.UTC(+m[1],+m[2]-1,+m[3]);if(isNaN(t))throw new Error("Ungültiges Datum: "+s);return t};
const iso=ms=>new Date(ms).toISOString().slice(0,10);
const wd=ms=>(new Date(ms).getUTCDay()+6)%7;
const p2=n=>String(n).padStart(2,"0");
const fmt=ms=>{const d=new Date(ms);return `${WT[wd(ms)]} ${p2(d.getUTCDate())}.${p2(d.getUTCMonth()+1)}.${p2(d.getUTCFullYear()%100)}`};
const dm=ms=>{const d=new Date(ms);return `${p2(d.getUTCDate())}.${p2(d.getUTCMonth()+1)}.`};
const dmy=ms=>dm(ms)+p2(new Date(ms).getUTCFullYear()%100);
const dmyy=ms=>dm(ms)+new Date(ms).getUTCFullYear();
const liste=x=>x==null?[]:Array.isArray(x)?x:[x];
const istMs=a=>a.typ==="meilenstein";
/* Letzter belegter Tag; bei dauer 0 liegt _e vor _s */
const bis=a=>Math.max(a._s,a._e);

function parseFrei(eintraege){
  const t=new Set();
  for(const e of eintraege||[]){
    const s=String(e);
    if(s.includes("..")){const [a,b]=s.split("..").map(x=>pd(x));for(let d=a;d<=b;d+=DAY)t.add(d)}
    else t.add(pd(s));
  }
  return t;
}
function alleAufgaben(p){const out=[];p.phasen.forEach((ph,pi)=>(ph.aufgaben||[]).forEach(a=>{a._phase=pi;out.push(a)}));return out}

/* Terminierung nach den Regeln im YAML-Kopf. Gibt {err} oder {ok, aufgaben, frei} zurück */
function terminiere(p){
  try{
    const frei=parseFrei(p.frei);
    const arb=d=>wd(d)<5&&!frei.has(d);
    const naechster=d=>{while(!arb(d))d+=DAY;return d};
    const plus=(d,n)=>{while(n>0){d+=DAY;if(arb(d))n--}return d};
    const aufg=alleAufgaben(p), byId={};
    for(const a of aufg){
      if(!a.id)throw new Error("Aufgabe ohne ID");
      if(byId[a.id])throw new Error("ID doppelt: "+a.id);
      if(!istMs(a)&&(!Number.isFinite(+a.dauer)||+a.dauer<0))throw new Error(`${a.id}: ungültige Dauer`);
      byId[a.id]=a;delete a._s;delete a._e;
    }
    const p0=naechster(pd(p.start)), done=new Set();
    const plane=(a,pfad=[])=>{
      if(done.has(a.id))return;
      if(pfad.includes(a.id))throw new Error("Zyklus: "+[...pfad,a.id].map(i=>byId[i].name||i).join(" → "));
      const nach=liste(a.nach), mit=a.mit?[a.mit]:[];
      for(const r of [...nach,...mit]){if(!byId[r])throw new Error(`${a.id}: unbekannte ID '${r}'`);plane(byId[r],[...pfad,a.id])}
      let s;
      if(a.start)s=naechster(pd(a.start));
      else if(nach.length)s=plus(Math.max(...nach.map(r=>byId[r]._e)),1);
      else if(a.mit)s=byId[a.mit]._s;
      else s=p0;
      s=plus(naechster(s),parseInt(a.versatz||0,10));
      // Meilenstein belegt seinen Tag; dauer 0 endet am Vortag, Nachfolger starten also am selben Tag
      const dauer=parseInt(a.dauer,10);
      a._s=s;a._e=istMs(a)?s:dauer===0?s-DAY:plus(s,dauer-1);
      done.add(a.id);
    };
    aufg.forEach(a=>plane(a));
    return {ok:true,aufgaben:aufg,frei,arb,p0};
  }catch(e){return {err:e.message}}
}

/* YAML schreiben im Stil von data.yaml (eine Aufgabe pro Zeile) */
const KOPF=`# Projektplan, Quelle für den Editor (gantt.html)
#
# Regeln:
#   dauer        Arbeitstage (Wochenenden und "frei" zählen nicht), 0 erlaubt; entfällt bei Meilensteinen
#   nach         ID oder Liste von IDs; Start am nächsten Arbeitstag nach dem spätesten Ende
#   mit          ID; gleicher Start wie diese Aufgabe
#   start        festes Datum (überschreibt nach/mit)
#   versatz      zusätzliche Arbeitstage auf den Start
#   fortschritt  0 bis 1
#   typ          arbeit (Standard) | doku | meilenstein
#   farbe        stahl | salbei | sand | flieder | schiefer | oliv | taupe | himmel (Phase oder Aufgabe, optional)
`;
function q(v){
  const s=String(v);
  const safe=/^[A-Za-zÄÖÜäöüß0-9(][^,:#\[\]{}"'&*!|>%@`\\]*$/.test(s)&&!/\s$/.test(s)&&!/^(true|false|null|yes|no|on|off|y|n|~|[-+]?[0-9][0-9._]*|0x[0-9a-f]+)$/i.test(s)&&!/ #/.test(s);
  return safe?s:JSON.stringify(s);
}
function toYaml(p){
  const L=[KOPF];
  L.push(`titel: ${q(p.titel||"")}`);
  if(p.autor)L.push(`autor: ${q(p.autor)}`);
  L.push(`start: ${p.start}`);
  if((p.frei||[]).length){L.push("frei:");p.frei.forEach(f=>L.push(`  - ${f}`))}
  L.push("","phasen:");
  p.phasen.forEach((ph,i)=>{
    if(i)L.push("");
    L.push(`  - name: ${q(ph.name||"")}`);
    if(ph.farbe)L.push(`    farbe: ${ph.farbe}`);
    if(!(ph.aufgaben||[]).length){L.push("    aufgaben: []");return}
    L.push("    aufgaben:");
    for(const a of ph.aufgaben){
      const f=[`id: ${q(a.id)}`,`name: ${q(a.name||"")}`];
      if(a.notiz)f.push(`notiz: ${q(a.notiz)}`);
      if(a.typ&&a.typ!=="arbeit")f.push(`typ: ${a.typ}`);
      if(a.farbe)f.push(`farbe: ${a.farbe}`);
      const n=liste(a.nach);
      if(n.length)f.push(n.length===1?`nach: ${q(n[0])}`:`nach: [${n.map(q).join(", ")}]`);
      if(a.mit)f.push(`mit: ${q(a.mit)}`);
      if(a.start)f.push(`start: ${a.start}`);
      if(+a.versatz)f.push(`versatz: ${+a.versatz}`);
      if(!istMs(a))f.push(`dauer: ${+a.dauer}`);
      const fs=Math.round((+a.fortschritt||0)*100)/100;
      if(fs>0)f.push(`fortschritt: ${fs}`);
      L.push(`      - {${f.join(", ")}}`);
    }
  });
  return L.join("\n")+"\n";
}
function normalisiere(raw){
  if(!raw||typeof raw!=="object")throw new Error("Datei ist kein Projektplan");
  for(const k of ["titel","start","phasen"])if(raw[k]==null)throw new Error(`Pflichtfeld '${k}' fehlt`);
  const p={titel:String(raw.titel),autor:raw.autor?String(raw.autor):"",start:String(raw.start),frei:(raw.frei||[]).map(String),phasen:[]};
  pd(p.start);
  for(const ph of raw.phasen||[]){
    const q={name:String(ph.name||""),aufgaben:[]};
    if(ph.farbe)q.farbe=String(ph.farbe);
    for(const a of ph.aufgaben||[]){
      const ms=String(a.typ)==="meilenstein";
      if(a.id==null||(!ms&&a.dauer==null))throw new Error("Aufgabe ohne id oder dauer: "+JSON.stringify(a));
      const t={id:String(a.id),name:String(a.name??a.id)};
      if(!ms)t.dauer=+a.dauer;
      if(a.notiz)t.notiz=String(a.notiz);
      if(a.typ)t.typ=String(a.typ);
      if(a.farbe)t.farbe=String(a.farbe);
      if(a.nach!=null)t.nach=liste(a.nach).map(String);
      if(a.mit)t.mit=String(a.mit);
      if(a.start)t.start=String(a.start);
      if(a.versatz)t.versatz=+a.versatz;
      if(a.fortschritt)t.fortschritt=+a.fortschritt;
      q.aufgaben.push(t);
    }
    p.phasen.push(q);
  }
  return p;
}
//#core-end

/* ---------------------------------------------------------------- App */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let state=null, sel=null, handle=null, dirty=false, fileName="eingebettete Vorlage", lastMod=0;
let undo=[], redo=[], lastKey="", lastT=0;
let drag=null, frz=null, noClick=false; /* laufendes Ziehen, festgehaltene Zeitachse, Klick nach dem Ziehen schlucken */
let auto=true,autoT=null,konflikt=false;try{auto=localStorage.getItem("gantt-auto")!=="0"}catch{}
const PAL={stahl:"#7F95B2",salbei:"#8FAE93",sand:"#C9AC73",flieder:"#A992B5",schiefer:"#8A94A0",oliv:"#A3A66B",taupe:"#AA9A8C",himmel:"#86AFC7"};
const PALN=Object.keys(PAL);
const phHue=(ph,pi)=>PAL[ph.farbe]||PAL[PALN[pi%PALN.length]];
let zu=new Set();try{zu=new Set(JSON.parse(localStorage.getItem("gantt-zu")||"[]"))}catch{}
const saveZu=()=>{try{localStorage.setItem("gantt-zu",JSON.stringify([...zu]))}catch{}};
const snap=()=>JSON.stringify(state,(k,v)=>k[0]==="_"?undefined:v);
/* Nummern: Aufgaben "Phase.Nr", Meilensteine projektweit "MS1", "MS2", … (zählen bei den Aufgaben nicht mit) */
function nummern(){
  const m=new Map();let k=0;
  state.phasen.forEach((ph,pi)=>{let j=0;for(const a of ph.aufgaben)m.set(a,istMs(a)?"MS"+ ++k:`${pi+1}.${++j}`)});
  return m;
}

function toast(msg,kind){
  const b=$("#banner");b.className=kind||"";b.textContent=msg;b.style.display="block";
  clearTimeout(toast.t);if(kind!=="keep")toast.t=setTimeout(()=>b.style.display="none",6000);
}
function banner(html){const b=$("#banner");b.className="info";b.innerHTML=html;b.style.display="block";clearTimeout(toast.t)}

function loadText(text,name){
  const raw=jsyaml.load(text,{schema:jsyaml.JSON_SCHEMA});
  const p=normalisiere(raw);
  const r=terminiere(p);
  if(r.err)throw new Error(r.err);
  state=p;undo=[];redo=[];dirty=false;konflikt=false;clearTimeout(autoT);if(name)fileName=name;
  if(sel&&!findTask(sel))sel=null;
  $("#banner").style.display="none";
  renderAll();
}
function findTask(id){for(const ph of state.phasen)for(const a of ph.aufgaben)if(a.id===id)return {a,ph};return null}

function mutate(key,fn){
  const before=snap();
  fn();
  const r=terminiere(state);
  if(r.err){state=JSON.parse(before);terminiere(state);toast(r.err);renderDrawer();return false}
  if(!(key&&key===lastKey&&Date.now()-lastT<1500)){undo.push(before);if(undo.length>200)undo.shift()}
  lastKey=key;lastT=Date.now();redo=[];dirty=true;
  renderChart();renderMeta();updInfo();updBtns();schedAuto();return true;
}
function undoStep(from,to){
  if(!from.length)return;
  to.push(snap());state=JSON.parse(from.pop());terminiere(state);dirty=true;lastKey="";
  if(sel&&!findTask(sel))sel=null;
  renderAll();schedAuto();
}

/* ------------- Diagramm */
const CK='<svg class="ck" viewBox="0 0 12 12"><path d="M2.5 6.4l2.4 2.4 4.6-5.2"/></svg>';
function renderStats(r){
  const w=r.aufgaben.filter(a=>!istMs(a)),tot=w.reduce((x,a)=>x+ +a.dauer,0);
  const pg=tot?w.reduce((x,a)=>x+a.dauer*(+a.fortschritt||0),0)/tot:0;
  const s0=r.p0,e0=Math.max(...r.aufgaben.map(bis));
  const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  let total=0,el=0;for(let d=s0;d<=e0;d+=DAY)if(r.arb(d)){total++;if(d<=today)el++}
  const zp=total?el/total:0;
  const tile=(l,v,c)=>`<div class="stat"><div class="sl">${l}</div><div class="sbar"><i style="width:${(v*100).toFixed(1)}%;background:${c}"></i></div><div class="sv">${Math.round(v*100)} %</div></div>`;
  const t=(l,v)=>`<div class="t"><div class="tl">${l}</div><div class="tv">${v}</div></div>`;
  $("#times").innerHTML=t("Start",dmyy(pd(state.start)))+t("Ende",dmyy(e0))+t("Stand",dmyy(today));
  $("#stats").innerHTML=tile("Gesamtfortschritt",pg,"var(--stat-prog)")+tile("Verstrichene Zeit",zp,"var(--heute)");
}
function renderMeta(){
  const r=terminiere(state);if(r.err)return;
  const ende=Math.max(...r.aufgaben.map(bis));
  const heute=new Date();
  renderStats(r);
  $("#h1").textContent=state.titel;
  $("#meta").textContent=state.autor||"";
  document.title=state.titel.slice(0,60)+" – Projektplan";
}
function renderChart(){
  const r=terminiere(state);if(r.err){toast(r.err);return}
  const aufg=r.aufgaben, nr=nummern();
  if(!aufg.length){$("#chart").innerHTML='<div style="padding:24px;color:var(--text-3)">Noch keine Aufgaben. Mit „+ Phase" beginnen.</div>';return}
  let t0=Math.min(...aufg.map(a=>a._s));t0-=wd(t0)*DAY;
  let t1=Math.max(...aufg.map(bis));t1+=(6-wd(t1)+7)*DAY;
  // Beim Ziehen darf die Zeitachse nur wachsen, sonst ändert sich der Maßstab unter dem Mauszeiger
  if(frz){t0=Math.min(t0,frz.t0);t1=Math.max(t1,frz.t1)}
  const n=Math.round((t1-t0)/DAY)+1;
  const pos=d=>(d-t0)/DAY/n*100;
  const span=(s,e)=>`left:${pos(s).toFixed(4)}%;width:${(((e-s)/DAY+1)/n*100).toFixed(4)}%`;
  const tage=n=>n==1?"1 Arbeitstag":n+" Arbeitstage";
  const zeit=a=>istMs(a)||a._e<a._s?fmt(a._s):`${dm(a._s)} bis ${dmy(a._e)}`;
  const out=[];
  let head="";
  const starts=[];
  for(let d=t0;d<=t1;d+=DAY){
    const dd=new Date(d);
    if(d===t0||dd.getUTCDate()===1)starts.push({d,y:dd.getUTCFullYear(),m:dd.getUTCMonth()});
    head+=`<div class="dd${wd(d)>4?" we":""}${wd(d)===0?" mo":""}" style="left:${pos(d).toFixed(4)}%;width:${(100/n).toFixed(4)}%">${dd.getUTCDate()}</div>`;
    if(wd(d)===0){const th=new Date(d+3*DAY);const y0=Date.UTC(th.getUTCFullYear(),0,1);const kw=Math.floor((th-y0)/DAY/7)+1;head+=`<div class="kw" style="left:${pos(d).toFixed(4)}%"><span class="k">KW </span>${kw}</div>`}
  }
  const ende=t1+DAY, wpos=(x,y)=>`left:${pos(x).toFixed(4)}%;width:${(pos(y)-pos(x)).toFixed(4)}%`;
  starts.forEach((st,i)=>{
    const nxt=i+1<starts.length?starts[i+1].d:ende;
    const kurz=(nxt-st.d)/DAY<7; // angebrochener Monat am Rand: Name weglassen
    head+=`<div class="mon" style="left:${pos(st.d).toFixed(4)}%">${kurz?"":`${MONATE[st.m]} ${st.y}`}</div>`;
    head+=`<div class="mo2" style="${wpos(st.d,nxt)}">${kurz?"":MONATE[st.m]}</div>`;
  });
  const jahre=starts.filter(st=>st===starts[0]||st.m===0);
  jahre.forEach((st,i)=>{
    const nxt=i+1<jahre.length?jahre[i+1].d:ende;
    head+=`<div class="yr" style="${wpos(st.d,nxt)}">${st.y}</div>`;
  });
  out.push(`<div class="row head"><div class="label">Aufgabe</div><div class="lane">${head}</div></div>`);
  state.phasen.forEach((ph,pi)=>{
    const auf=ph.aufgaben, zuC=zu.has(ph.name), h=phHue(ph,pi);
    let box="",grip="",tip="",sum="keine Aufgaben",alle=false;
    if(auf.length){
      const ps=Math.min(...auf.map(a=>a._s)),pe=Math.max(...auf.map(bis));
      const w=auf.filter(a=>!istMs(a)),tot=w.reduce((x,a)=>x+ +a.dauer,0);
      alle=w.length>0&&w.every(a=>(+a.fortschritt||0)>=1);
      const pg=tot?w.reduce((x,a)=>x+a.dauer*(+a.fortschritt||0),0)/tot:0;
      const bl=pos(ps),bw=((pe-ps)/DAY+1)/n*100;
      box=`<div class="box" style="left:${bl.toFixed(4)}%;width:${bw.toFixed(4)}%">${zuC&&pg>0?`<i class="pg" style="width:${(pg*100).toFixed(1)}%"></i>`:""}${zuC&&alle?CK:""}</div>`;
      grip=`<i class="pgrip" data-drag="p" style="left:${bl.toFixed(4)}%;width:${bw.toFixed(4)}%"></i>`;
      tip=`<b>${esc(ph.name)}</b><br>${dm(ps)} bis ${dmy(pe)}<br>${auf.length} Aufgabe${auf.length==1?"":"n"} · Fortschritt ${Math.round(pg*100)} %`;
      sum=`${dm(ps)} bis ${dmy(pe)} · ${auf.length} Aufgabe${auf.length==1?"":"n"} · ${Math.round(pg*100)} %`;
    }
    const rows=[`<div class="row phase${sel==="p"+pi?" sel":""}" data-phase="${pi}"><div class="label"><button class="chev" data-toggle="${pi}" title="${zuC?"Ausklappen":"Einklappen"}"></button><div class="tx"><div class="name"><span class="nr">${pi+1}.</span>${esc(ph.name||"(ohne Name)")}${alle?`<span class="okb">${CK}</span>`:""}</div><div class="sub">${sum}</div></div></div><div class="lane"${tip?` data-tip="${esc(tip)}"`:""}>${grip}</div></div>`];
    if(!zuC)for(const a of auf){
      const fs=+a.fortschritt||0, notiz=a.notiz;
      const sub=zeit(a)+(istMs(a)?" · Meilenstein":` · ${tage(a.dauer)}`)+(notiz?` · ${esc(notiz)}`:"");
      const tp=`<b>${esc(a.name)}</b><br>${esc(zeit(a))}`+(istMs(a)?" · Meilenstein":` · ${tage(a.dauer)}<br>Fortschritt ${Math.round(fs*100)} %`)+(notiz?`<br>${esc(notiz)}`:"")+`<br><span style="opacity:.6">id: ${esc(a.id)}</span>`;
      const bh=a.farbe&&PAL[a.farbe]?` --bh:${PAL[a.farbe]};`:"";
      let mark;
      if(istMs(a))mark=`<div class="ms" data-drag="m" style="left:${(pos(a._s)+0.5/n*100).toFixed(4)}%" data-tip="${esc(tp)}"></div>`;
      else{
        const pct=fs>0?`<div class="pct" style="left:${pos(a._e+DAY).toFixed(4)}%">${Math.round(fs*100)} %</div>`:"";
        mark=`<div class="bar ${a.typ==="doku"?"doku":""}" data-drag="m" style="${span(a._s,a._e)};${bh}" data-tip="${esc(tp)}"><div class="done" style="width:${(fs*100).toFixed(1)}%"></div>${fs>=1?CK:""}</div>${pct}<i class="hd l" data-drag="l" style="left:${pos(a._s).toFixed(4)}%" title="Ziehen: Start verschieben"></i><i class="hd r" data-drag="r" style="left:${pos(a._e+DAY).toFixed(4)}%" title="Ziehen: Dauer ändern"></i>`;
      }
      rows.push(`<div class="row${sel===a.id?" sel":""}${drag&&drag.id===a.id?" drag":""}" data-id="${esc(a.id)}"><div class="label"><span class="nr">${nr.get(a)}</span><div class="name" title="${esc(a.name)}">${esc(a.name)}</div><div class="sub">${sub}</div></div><div class="lane">${mark}</div></div>`);
    }
    out.push(`<div class="grp${zuC?" zu":""}${drag&&drag.phase===pi?" drag":""}" style="--h:${h}"><div class="boxlayer">${box}</div>${rows.join("")}</div>`);
  });
  const fr=[...r.frei].filter(x=>x>=t0&&x<=t1).sort((a,b)=>a-b),bl=[];
  for(const x of fr){if(bl.length&&(x-bl[bl.length-1][1])/DAY===1)bl[bl.length-1][1]=x;else bl.push([x,x])}
  const freiH=bl.map(([s,e])=>`<div class="frei" style="${span(s,e)}"></div><div class="frei-label" style="left:${pos(s).toFixed(4)}%">frei</div>`).join("");
  const ch=$("#chart");
  ch.style.setProperty("--days",n);ch.dataset.t0=iso(t0);ch.dataset.days=n;
  // Breite der Nummernspalte: längste Nummer; "MS" ist breiter als zwei Ziffern, daher +1ch
  ch.style.setProperty("--nrw",Math.max(3,...[...nr.values()].map(s=>s.length+(s.startsWith("MS")?1:0)))+"ch");
  const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()),d=(today-t0)/DAY;
  const heute=(d>=0&&d<n)?`<div class="heute" style="display:block;left:calc(var(--lw) + (100% - var(--lw)) * ${((d+.5)/n).toFixed(5)})"><b>Heute</b></div>`:"";
  // Monatsgrenzen über die ganze Höhe; der erste Eintrag ist der linke Rand und braucht keine Linie
  const monH=starts.slice(1).map(st=>`<div class="mline" style="left:${pos(st.d).toFixed(4)}%"></div>`).join("");
  ch.innerHTML=`<div class="overlay">${freiH}${monH}</div>${heute}${out.join("")}`;
  fitDays();
}
function fitDays(){
  const ch=$("#chart"),lane=ch.querySelector(".row.head .lane"),n=+ch.dataset.days;
  if(!lane||!n)return;
  const px=lane.getBoundingClientRect().width/n;
  const lv=n>=1100?3:px>=7.2?0:px>=2.2?1:2;
  ch.classList.remove("lv0","lv1","lv2","lv3");ch.classList.add("lv"+lv);
}

function entferneRefs(id){
  const g=alleAufgaben(state).find(x=>x.id===id);
  const ers=g?(liste(g.nach).length?liste(g.nach):(g.mit?[g.mit]:[])):[];
  for(const a of alleAufgaben(state)){
    if(a.id===id)continue;
    let n=liste(a.nach);
    if(n.includes(id))n=n.filter(x=>x!==id).concat(ers);
    if(a.mit===id){delete a.mit;if(ers.length&&!(a.nach&&a.nach.length))n=n.concat(ers)}
    n=[...new Set(n)].filter(x=>x!==a.id);
    if(n.length)a.nach=n;else delete a.nach;
  }
}

/* ------------- Ziehen. Griffe an den Balkenenden: rechts ändert die Dauer, links den Start (das Ende bleibt stehen).
   Balken oder Meilenstein: Aufgabe verschieben. Kopfzeile der Haupt-AP: ganze Phase verschieben.
   Verschoben wird in Arbeitstagen über versatz, nie vor das, was die Abhängigkeiten erlauben; bei festem Startdatum über start. */
$("#chart").addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-drag]");if(!h||e.button!==0)return;
  const arb=terminiere(state).arb,ch=$("#chart"),n=+ch.dataset.days,t0=pd(ch.dataset.t0);
  // v0: vorhandener Versatz, also wie weit die Aufgabe höchstens nach vorn darf (außer bei festem Start)
  const anker=a=>({a,s0:a._s,e0:a._e,v0:parseInt(a.versatz||0,10),orig:{dauer:a.dauer,versatz:a.versatz,start:a.start}});
  let ziel;
  if(h.dataset.drag==="p"){
    const pi=+h.closest(".row[data-phase]").dataset.phase,auf=state.phasen[pi].aufgaben,ids=new Set(auf.map(a=>a.id));
    // Nur Aufgaben ohne Vorgänger in derselben Phase bekommen Versatz, der Rest folgt über die Abhängigkeiten
    const wurzeln=auf.filter(a=>a.start||![...liste(a.nach),...(a.mit?[a.mit]:[])].some(r=>ids.has(r)));
    ziel={phase:pi,anker:wurzeln.map(anker),ps:Math.min(...auf.map(a=>a._s))};
    h.closest(".grp").classList.add("drag");
  }else{
    const f=findTask(h.closest(".row[data-id]").dataset.id);if(!f)return;
    ziel={id:f.a.id,seite:h.dataset.drag,anker:[anker(f.a)],ps:f.a._s};
    h.closest(".row").classList.add("drag");
  }
  e.preventDefault();
  drag={...ziel,arb,x0:e.clientX,moved:false,hint:"",before:snap(),
    px:ch.querySelector(".row.head .lane").getBoundingClientRect().width/n};
  frz={t0,t1:t0+(n-1)*DAY};
  document.documentElement.classList.add("dragging");
  if(drag.seite!=="l"&&drag.seite!=="r")document.documentElement.classList.add("mv");
  addEventListener("pointermove",dragMove);addEventListener("pointerup",dragUp);addEventListener("pointercancel",dragCancel);
  dragTip(e);
});
function dragMove(e){
  const d=drag,arb=d.arb;
  const nAT=(x,y)=>{let c=0;for(let t=x;t<=y;t+=DAY)if(arb(t))c++;return c};
  const schiebe=(s,w)=>{while(w>0){s+=DAY;if(arb(s))w--}while(w<0){s-=DAY;if(arb(s))w++}return s};
  if(Math.abs(e.clientX-d.x0)>3)d.moved=true;
  const k=d.moved?Math.round((e.clientX-d.x0)/d.px):0; // erst ab 3 px, damit ein Klick nichts verschiebt
  const sig=()=>d.anker.map(x=>[x.a.dauer,x.a.versatz,x.a.start].join()).join("|"),vor=sig();
  // Jedes Mal vom Ausgangszustand rechnen, damit Zurückziehen genau den alten Stand ergibt
  for(const x of d.anker)for(const [f,v] of Object.entries(x.orig))if(v===undefined)delete x.a[f];else x.a[f]=v;
  d.hint="";
  if(k&&d.seite==="r"){const x=d.anker[0];x.a.dauer=Math.max(1,nAT(x.s0,x.e0+k*DAY))}
  else if(k){
    // Verschiebung in Arbeitstagen, gemessen am frühesten Start
    let z=d.ps+k*DAY;while(!arb(z))z+=DAY;
    let w=z>=d.ps?nAT(d.ps,z)-1:1-nAT(z,d.ps);
    const eng=d.anker.filter(x=>!x.orig.start).sort((p,q)=>p.v0-q.v0)[0]; // wer am wenigsten Versatz übrig hat
    if(eng&&w<-eng.v0){w=-eng.v0;d.hint=liste(eng.a.nach).length||eng.a.mit?"Früher nicht möglich: hängt von Vorgängern ab":"Früher nicht möglich: Projektstart"}
    const ende=d.seite==="l"?Math.max(d.anker[0].s0,d.anker[0].e0):0; // linker Griff: letzter belegter Tag bleibt stehen
    if(ende)w=Math.min(w,nAT(d.anker[0].s0,ende)-1);
    for(const x of d.anker){
      if(x.orig.start){x.a.start=iso(schiebe(x.s0,w));delete x.a.versatz}
      else if(x.v0+w)x.a.versatz=x.v0+w;else delete x.a.versatz;
    }
    if(ende){const x=d.anker[0];x.a.dauer=Math.max(1,nAT(schiebe(x.s0,w),ende))}
  }
  if(sig()!==vor){renderChart();renderMeta();updInfo()}
  dragTip(e);
}
function dragTip(e){
  const d=drag;let h;
  if(d.phase!=null){
    const ph=state.phasen[d.phase],auf=ph.aufgaben;
    h=`<b>${esc(ph.name)}</b><br>${dm(Math.min(...auf.map(a=>a._s)))} bis ${dmy(Math.max(...auf.map(bis)))}`;
  }else{
    const a=d.anker[0].a,t=+a.dauer===1?"1 Arbeitstag":a.dauer+" Arbeitstage";
    h=`<b>${esc(a.name)}</b><br>`+(istMs(a)?`${fmt(a._s)} · Meilenstein`:`${a._e<a._s?fmt(a._s):`${fmt(a._s)} bis ${fmt(a._e)}`} · ${t}`);
  }
  tip.innerHTML=h+(d.hint?`<br>${d.hint}`:"");
  tip.style.display="block";placeTip(e);
}
function dragUp(){dragEnd(true)}
function dragCancel(){dragEnd(false)}
function dragEnd(ok){
  const d=drag;if(!d)return;
  removeEventListener("pointermove",dragMove);removeEventListener("pointerup",dragUp);removeEventListener("pointercancel",dragCancel);
  document.documentElement.classList.remove("dragging","mv");tip.style.display="none";
  drag=null;frz=null;
  if(!ok)state=JSON.parse(d.before);
  const neu=snap()!==d.before;
  if(neu){undo.push(d.before);if(undo.length>200)undo.shift();redo=[];dirty=true;lastKey="";schedAuto()}
  if(d.moved){noClick=true;setTimeout(()=>noClick=false)}
  // Ohne Änderung nicht neu zeichnen, sonst verschwindet das Element und der Klick (Zeile auswählen) geht verloren
  if(neu||!ok)renderAll();else document.querySelectorAll("#chart .drag").forEach(x=>x.classList.remove("drag"));
}

/* ------------- Datei */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("gantt-editor",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvGet=async k=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const kvSet=async(k,v)=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("kv","readwrite").objectStore("kv").put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})};
const YAMLTYPES=[{description:"YAML",accept:{"text/yaml":[".yaml",".yml"]}}];

async function erlaubnis(h){
  try{
    let st=await h.queryPermission({mode:"readwrite"});
    if(st!=="granted")st=await h.requestPermission({mode:"readwrite"});
    if(st!=="granted"){st=await h.queryPermission({mode:"read"});if(st!=="granted")await h.requestPermission({mode:"read"})}
  }catch{}
}
async function openHandle(h){
  await erlaubnis(h);
  const f=await h.getFile();
  loadText(await f.text(),f.name);
  handle=h;lastMod=f.lastModified;updBtns();
  try{await kvSet("handle",h)}catch{}
}
async function doOpen(){
  try{
    if(window.showOpenFilePicker){
      const [h]=await showOpenFilePicker({types:YAMLTYPES});
      try{await openHandle(h)}
      catch(e){
        if(e.name==="NotAllowedError"||e.name==="SecurityError"||e.name==="NotReadableError")return zugriffVerweigert(e);
        throw e;
      }
    }else $("#fileIn").click();
  }catch(e){if(e.name!=="AbortError")toast("Öffnen fehlgeschlagen: "+e.message)}
}
function zugriffVerweigert(e){
  const kontext=window.top!==window?" Die Seite läuft in einem eingebetteten Fenster (z. B. Vorschau in einer IDE); öffne sie direkt in Edge oder Chrome.":"";
  banner(`Der Browser verweigert den dauerhaften Zugriff auf die Datei (${esc(e.name)}).${kontext} Du kannst die Datei trotzdem einmalig laden, dann gibt es aber kein Autospeichern: „Speichern" lädt die Datei als Download herunter. <button class="btn pri" id="bFb">Datei trotzdem laden</button>`);
  $("#bFb").onclick=()=>$("#fileIn").click();
}
function schedAuto(){clearTimeout(autoT);if(!auto||!handle||!dirty||konflikt)return;autoT=setTimeout(autoSave,1000)}
async function autoSave(){
  if(!auto||!handle||!dirty||konflikt||drag)return;
  try{
    const f=await handle.getFile();
    if(f.lastModified!==lastMod){zeigeKonflikt();return}
    await doSave(true);
  }catch(e){toast("Automatisches Speichern fehlgeschlagen: "+e.message)}
}
function zeigeKonflikt(){
  konflikt=true;updBtns();
  banner('Die Datei wurde außerhalb geändert, Autospeichern ist pausiert. <button class="btn" id="bReload">Datei neu laden (meine Änderungen verwerfen)</button><button class="btn" id="bForce">Meine Version speichern</button>');
  $("#bReload").onclick=async()=>{const g=await handle.getFile();loadText(await g.text(),g.name);lastMod=g.lastModified};
  $("#bForce").onclick=()=>{konflikt=false;doSave(true)};
}
/* Name der geöffneten YAML, sonst data.yaml */
const dateiName=()=>/\.ya?ml$/i.test(fileName)?fileName:"data.yaml";
async function doSave(silent){
  if(konflikt&&!silent&&!confirm("Die Datei wurde außerhalb geändert. Trotzdem mit deiner Version überschreiben?"))return;
  try{
    const text=toYaml(state);
    if(!handle&&window.showSaveFilePicker){handle=await showSaveFilePicker({suggestedName:dateiName(),types:YAMLTYPES});fileName=handle.name;try{await kvSet("handle",handle)}catch{}}
    if(handle){
      const w=await handle.createWritable();await w.write(text);await w.close();
      lastMod=(await handle.getFile()).lastModified;
    }else{
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/yaml"}));a.download=dateiName();a.click();
    }
    dirty=false;konflikt=false;$("#banner").style.display="none";updBtns();
  }catch(e){if(e.name!=="AbortError")toast("Speichern fehlgeschlagen: "+e.message)}
}
const THEMES=["auto","light","dark"],THEMEN={auto:"Automatisch",light:"Hell",dark:"Dunkel"};
let theme="auto";try{theme=localStorage.getItem("gantt-theme")||"auto"}catch{}
if(!THEMES.includes(theme))theme="auto";
function applyTheme(){
  const r=document.documentElement;
  if(theme==="auto")r.removeAttribute("data-theme");else r.dataset.theme=theme;
  $("#bTheme").textContent="◐ Darstellung: "+THEMEN[theme];
}
$("#bTheme").addEventListener("click",()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];try{localStorage.setItem("gantt-theme",theme)}catch{};applyTheme()});
applyTheme();
/* PDF: ganze Seite als eine durchgehende Druckseite (Breite fest, Hoehe = Inhalt), ohne Seitenumbrueche */
function prepPrint(){
  const r=document.documentElement,alt=r.dataset.theme;
  r.dataset.theme=alt||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.classList.add("printing");fitDays();
  const st=document.createElement("style");st.id="pageSize";document.head.append(st);
  const fertig=()=>{
    removeEventListener("afterprint",fertig);
    r.classList.remove("printing");st.remove();
    if(alt)r.dataset.theme=alt;else r.removeAttribute("data-theme");
    fitDays();
  };
  addEventListener("afterprint",fertig);
  return new Promise(res=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const h=Math.ceil($(".main").getBoundingClientRect().height)+80;
    st.textContent=`@page{size:1480px ${h}px;margin:0}`;
    res();
  })));
}
function exportPdf(){prepPrint().then(()=>setTimeout(()=>window.print(),60))}
$("#bPdf").addEventListener("click",exportPdf);
function setTools(o){
  $(".toolbar").classList.toggle("open",o);$("#bTools").classList.toggle("open",o);$("#bTools").setAttribute("aria-expanded",o);
  try{localStorage.setItem("gantt-tools",o?"1":"0")}catch{}
}
$("#bTools").addEventListener("click",()=>setTools(!$(".toolbar").classList.contains("open")));
try{if(localStorage.getItem("gantt-tools")==="1")setTools(true)}catch{}
$("#cAuto").checked=auto;
$("#cAuto").addEventListener("change",e=>{auto=e.target.checked;try{localStorage.setItem("gantt-auto",auto?"1":"0")}catch{};updBtns();if(auto)schedAuto()});
$("#bOpen").addEventListener("click",doOpen);
$("#bSave").addEventListener("click",doSave);
const fi=document.createElement("input");fi.type="file";fi.accept=".yaml,.yml";fi.id="fileIn";fi.hidden=true;document.body.append(fi);
fi.addEventListener("change",async()=>{const f=fi.files[0];if(!f)return;try{loadText(await f.text(),f.name)}catch(e){toast(e.message)}});
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",async e=>{e.preventDefault();const it=e.dataTransfer.items[0];
  try{if(it&&it.getAsFileSystemHandle){const h=await it.getAsFileSystemHandle();if(h&&h.kind==="file"){await openHandle(h);return}}
    const f=e.dataTransfer.files[0];if(f)loadText(await f.text(),f.name)}catch(err){toast(err.message)}});
addEventListener("keydown",e=>{
  if(drag){if(e.key==="Escape"){e.preventDefault();dragEnd(false)}return} // Escape bricht das Ziehen ab
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.activeElement.type!=="range"&&document.activeElement.type!=="checkbox";
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();doSave()}
  else if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undoStep(e.shiftKey?redo:undo,e.shiftKey?undo:redo)}
  else if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();undoStep(redo,undo)}
  else if(e.key==="Escape"&&sel&&!typing)closeDrawer();
});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* Externe Änderungen an der Datei erkennen (z. B. in VS Code bearbeitet) */
setInterval(async()=>{
  if(!handle||drag)return;
  try{
    const f=await handle.getFile();
    if(f.lastModified===lastMod)return;
    if(!dirty){loadText(await f.text(),f.name);lastMod=f.lastModified;toast("Datei wurde extern geändert und neu geladen.","info")}
    else if(!konflikt)zeigeKonflikt();
  }catch{}
},2000);

function updBtns(){
  $("#bTools").classList.toggle("warn",konflikt||(dirty&&!(auto&&handle)));
  $("#bSave").classList.toggle("pri",!(auto&&handle&&!konflikt));
  $("#bUndo").disabled=!undo.length;$("#bRedo").disabled=!redo.length;
  const s=$("#status");s.className="status "+(dirty?"dirty":handle?"saved":"");
  $("#stxt").textContent=fileName+(konflikt?" · Konflikt mit Datei":dirty?(auto&&handle?" · speichert gleich …":" · ungespeicherte Änderungen"):handle?(auto?" · automatisch gespeichert":" · gespeichert"):"");
}
function renderAll(){renderMeta();renderChart();renderDrawer();updBtns()}

(async function start(){
  try{loadText($("#default-yaml").textContent,"eingebettete Vorlage")}catch(e){toast(e.message)}
  const h=location.hash.match(/t=([\w-]+)/);if(h&&state&&findTask(h[1])){sel=h[1];expandFor(sel);renderAll()}
  if(/proj/.test(location.hash)){sel="proj";renderAll()}
  try{
    const st=await kvGet("handle");
    if(!st&&window.showOpenFilePicker){
      const eingebettet=window.top!==window;
      banner('<b>Änderungen werden noch nicht gespeichert:</b> keine Datei verbunden, es wird die eingebettete Vorlage gezeigt. <button class="btn pri" id="bConn">YAML-Datei verbinden</button><br><span style="color:var(--text-2)">Einmalig die YAML-Datei (z. B. <b>data.yaml</b>) im Ordner wählen und im Dialog <b>„Bei jedem Besuch zulassen"</b> anklicken. Danach lädt und speichert die Seite die Datei selbst.'+(eingebettet?' <b>Diese Seite läuft in einem eingebetteten Fenster (z. B. IDE-Vorschau), dort ist das gesperrt: bitte direkt in Edge oder Chrome öffnen.</b>':'')+'</span>');
      $("#bConn").onclick=async()=>{await doOpen();if(handle)$("#banner").style.display="none"};
    }
    if(st){
      const perm=await st.queryPermission({mode:"readwrite"});
      if(perm==="granted")await openHandle(st);
      else{
        banner(`Zuletzt verwendete Datei <b>${esc(st.name)}</b>: der Browser braucht für den Zugriff eine Bestätigung. <button class="btn pri" id="bRe">${esc(st.name)} laden</button> <span style="color:var(--text-3)">(im Dialog „Bei jedem Besuch zulassen" wählen, dann entfällt das künftig)</span>`);
        $("#bRe").onclick=async()=>{try{if(await st.requestPermission({mode:"readwrite"})==="granted"){await openHandle(st);$("#banner").style.display="none"}}catch(e){toast(e.message)}};
      }
    }
  }catch{}
})();
</script>
